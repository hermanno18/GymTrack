{% extends "base.html" %}
{% block title %}Page Not Found - GymTrack{% endblock %}
{% block content %}
{% import "_icons.html" as icons %}
<div class="max-w-md mx-auto card glow-border rounded-2xl p-8 text-center">
    <div class="flex justify-center mb-4 text-accent">{{ icons.alert("w-10 h-10") }}</div>
    <h1 class="text-2xl font-bold mb-2">Page not found</h1>
    <p class="text-slate-400 text-sm mb-6">That link's broken or the page moved. Let's get you back on track.</p>
    <a href="{{ url_for('dashboard.home') if current_user.is_authenticated else url_for('auth.login') }}"
       class="tap inline-block px-6 py-3 rounded-lg bg-accent text-bg font-semibold hover:shadow-glow transition">
        Back to GymTrack
    </a>
</div>
{% endblock %}
