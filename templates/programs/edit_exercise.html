{% extends "base.html" %}
{% block title %}Edit Exercise - GymTrack{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto card glow-border rounded-2xl p-8">
    <h1 class="text-xl font-bold mb-6">Edit Exercise</h1>
    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Name</label>
            <input type="text" name="name" value="{{ exercise.name }}" required
                   hx-get="{{ url_for('builder.suggest_exercise_name') }}"
                   hx-vals='{"exclude_id": {{ exercise.id }}}'
                   hx-trigger="keyup changed delay:400ms"
                   hx-target="#suggestion-slot"
                   hx-include="this"
                   class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2 focus:border-accent focus:outline-none">
            <div id="suggestion-slot"></div>
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Category</label>
            <select name="category" class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2">
                <option value="strength" {% if exercise.category == 'strength' %}selected{% endif %}>Strength</option>
                <option value="cardio" {% if exercise.category == 'cardio' %}selected{% endif %}>Cardio</option>
                <option value="other" {% if exercise.category == 'other' %}selected{% endif %}>Other</option>
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Target Sets</label>
                <input type="number" name="sets" value="{{ exercise.target_sets or '' }}"
                       class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Target Reps</label>
                <input type="number" name="reps" value="{{ exercise.target_reps or '' }}"
                       class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Target Weight ({{ settings.weight_unit }})</label>
                <input type="number" step="0.1" name="weight"
                       value="{{ (exercise.target_weight_kg | display_weight(settings.weight_unit)) if exercise.target_weight_kg is not none else '' }}"
                       class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Target Distance ({{ settings.distance_unit }})</label>
                <input type="number" step="0.1" name="distance"
                       value="{{ (exercise.target_distance_km | display_distance(settings.distance_unit)) if exercise.target_distance_km is not none else '' }}"
                       class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2">
            </div>
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Notes</label>
            <textarea name="notes" rows="2" class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2">{{ exercise.notes or '' }}</textarea>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="flex-1 py-2 rounded-lg bg-accent text-bg font-semibold hover:shadow-glow transition">Save</button>
            <a href="{{ url_for('builder.edit_program', program_id=exercise.program_day.program_id) }}"
               class="flex-1 py-2 rounded-lg bg-slate-700 text-center hover:bg-slate-600 transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
