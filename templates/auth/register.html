{% extends "base.html" %}
{% block title %}Register - GymTrack{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto card glow-border rounded-2xl p-8 shadow-glow">
    <h1 class="text-2xl font-bold mb-6 text-accent">Create your account</h1>
    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2 focus:border-accent focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Password (min 8 chars)</label>
            <input type="password" name="password" required minlength="8"
                   class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2 focus:border-accent focus:outline-none">
        </div>
        <div>
            <label class="block text-sm text-slate-400 mb-1">Confirm Password</label>
            <input type="password" name="confirm" required minlength="8"
                   class="w-full rounded-lg bg-bg border border-slate-700 px-3 py-2 focus:border-accent focus:outline-none">
        </div>
        <button type="submit"
                class="w-full py-2 rounded-lg bg-accent2 text-white font-semibold hover:shadow-glow transition">
            Create Account
        </button>
    </form>
    <p class="text-sm text-slate-400 mt-4">
        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-accent hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
